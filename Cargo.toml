[package]
name = "git-lineage"
version = "0.1.0"
edition = "2021"
authors = ["Nayan Srivastava <nayansrivastava@example.com>"]
description = "The Codebase Archaeology CLI and Agent Forensic Primitive."
readme = "README.md"
license = "MIT"
keywords = ["git", "archaeology", "blame", "cli", "forensics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI Parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Git Traversal Engine
git2 = { version = "0.19", default-features = false }

# Terminal UI & Styling
owo-colors = "4.0"
comfy-table = "7.1"
crossterm = "0.28"
ratatui = { version = "0.28", optional = true }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization (JSON & Agent Output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = []
tui = ["dep:ratatui"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
