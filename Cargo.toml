[package]
name = "git-lineage"
version = "0.2.3"
edition = "2021"
authors = ["Nayan Srivastava <nayansrivastav@yahoo.in>"]
description = "The Codebase Archaeology CLI and Agent Forensic Primitive."
readme = "README.md"
license = "MIT"
keywords = ["git", "archaeology", "blame", "cli", "forensics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI Parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Terminal Styling
owo-colors = "4.0"

# Error Handling
anyhow = "1.0"

# Serialization (JSON & Agent Output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"



[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
format_push_string = "allow"
missing_errors_doc = "allow"
map_unwrap_or = "allow"
struct_excessive_bools = "allow"
