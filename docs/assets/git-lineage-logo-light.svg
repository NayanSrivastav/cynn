<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gll-diamond-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="gll-diamond-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="gll-branch-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="gll-node-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="gll-hyphen-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="gll-subtle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Diamond Icon -->
  <g transform="translate(130, 125)">
    <rect x="-80" y="-80" width="160" height="160" rx="34" transform="rotate(45)" fill="url(#gll-branch-gradient)" opacity="0.22" filter="url(#gll-subtle-glow)"/>
    <rect x="-80" y="-80" width="160" height="160" rx="34" transform="rotate(45)" fill="url(#gll-diamond-bg)" stroke="url(#gll-diamond-border)" stroke-width="2.5"/>
    <path d="M 0 -54 C 0 -18, -48 -32, -48 0 C -48 32, 0 18, 0 54" fill="none" stroke="url(#gll-branch-gradient)" stroke-width="12" stroke-linecap="round"/>
    <rect x="14" y="-22" width="52" height="10" rx="5" fill="#64748b" opacity="0.85"/>
    <rect x="14" y="-4" width="70" height="10" rx="5" fill="#64748b" opacity="0.85"/>
    <rect x="14" y="14" width="40" height="10" rx="5" fill="#64748b" opacity="0.85"/>
    <circle cx="0" cy="-54" r="13.5" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="-48" cy="0" r="13.5" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="0" cy="54" r="13.5" fill="#0f172a" stroke="url(#gll-node-magenta)" stroke-width="5.5"/>
  </g>

  <!-- Typography (Slate 900) -->
  <g transform="translate(285, 138)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="88" letter-spacing="-0.035em" fill="#0F172A">git</text>
    <rect x="122" y="-31" width="30" height="15" rx="7.5" fill="url(#gll-hyphen-gradient)"/>
    <text x="164" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="88" letter-spacing="-0.035em" fill="#0F172A">lineage</text>
    <text x="4" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#475569" letter-spacing="0.28em">TRACE THE ORIGIN OF CODE</text>
  </g>
</svg>